apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-job-cleaner-go
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-job-cleaner-go
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-job-cleaner-go
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-job-cleaner-go
subjects:
  - kind: ServiceAccount
    name: k8s-job-cleaner-go
    namespace: default
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-job-cleaner-go
  labels:
    job: k8s-job-cleaner-go
    role: job
spec:
  schedule: "0 * * * *"
  startingDeadlineSeconds: 30
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            job: k8s-job-cleaner-go
            role: job
        spec:
          serviceAccountName: k8s-job-cleaner-go
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: k8s-job-cleaner-go
              image: knpavankumar/k8s-job-cleaner-go:latest
              args:
                - --succeeded-ttl=1h
                - --failed-ttl=24h
                # - --dry-run
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
