services:
  k8s-job-cleaner-go:
    image: knpavankumar/k8s-job-cleaner-go:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - --dry-run
      - --verbose
      - --succeeded-ttl=1h
      - --failed-ttl=24h
      - --kubeconfig=/home/nonroot/.kube/config
    volumes:
      - ~/.kube/config:/home/nonroot/.kube/config:ro
